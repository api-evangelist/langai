summary: >-
  Lang.ai ships NO client SDK in any public package registry. The docs claim "the API
  libraries convert responses to appropriate language-specific objects", but no such
  library is published or linked anywhere, and none exists under the lang-ai GitHub
  organization. The 2026-08-14 pass found the intent though: github.com/lang-ai/langai-python
  exists, was created 2018-06-25 — and is EMPTY (size 0, no commits, no default-branch
  tree). A Python SDK was named and never written. What Lang.ai does distribute is not a
  client library at all: a Snowflake Native App on the Snowflake Marketplace, which is a
  deployable application rather than a package a developer imports. It is recorded below
  as the one real, first-party, verifiable distribution artifact.
