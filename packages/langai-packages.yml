sdk_pointer_note: >-
  No `SDKs` pointer is wired in apis.yml. The sdk_count check reads client libraries a
  developer can install to call the API, and Lang.ai publishes zero. A Snowflake Native
  App is a deployable application, not an API client, and wiring it as an SDK would
  credit Lang.ai with an integration surface it does not ship.
