aid: langai
name: Lang.ai
description: >-
  Lang.ai is a conversation-intelligence platform that turns unstructured customer
  interactions — support tickets, chatbot messages, emails and calls — into structured
  intents, features and tags. Its unsupervised algorithm ingests a dataset of customer
  text, automatically extracts the intents and features it finds, and lets teams group
  those into tags that form a custom classifier for any language, industry or business
  case. A small REST API then applies that classifier in real time: create a project from
  a CSV dataset, list projects and their tags, analyze a document to get back its matched
  tags and intents, and save documents with arbitrary metadata for dashboard reporting.
  Lang.ai was founded in Spain, backed by 500 Global, and is now part of Capacity, whose
  AI support-automation platform absorbed Lang.ai's conversation intelligence.
