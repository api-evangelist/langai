summary: >-
  Lang.ai runs a public Canny instance at roadmap.lang.ai (canonical host langai.canny.io)
  carrying both a feature-request board and a dated changelog, plus a real RSS feed. This
  was not captured in the previous round. IMPORTANT SCOPE NOTE: every entry describes the
  Lang.ai AI Agents product — the Snowflake Native App and its insights dashboard, chat and
  reporting surfaces — not the REST API documented at docs.lang.ai. No changelog entry in
  the published window touches the /api/v1 REST surface, its operations, or its contract.
  The REST API is therefore unversioned in practice and has no change signal of its own.
