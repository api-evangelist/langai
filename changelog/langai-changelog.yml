entries:
  - date: '2025-11-21'
    label: new
    title: Customize Your Insights Dashboard
    url: https://langai.canny.io/changelog/customize-your-insights-dashboard
    area: insights-dashboard
    breaking: false
    highlights:
      - Drag-and-drop reordering of pinned questions.
      - Charts now render automatically inside pinned questions.
      - Pinned questions can be renamed without changing the underlying query.
      - Pinned-question cards can be resized for flexible dashboard layouts.
  - date: '2025-10-13'
    label: new
    title: Pinned Chats
    url: https://langai.canny.io/changelog/pinned-chats
    area: insights-dashboard
    breaking: false
    highlights:
      - Pin up to 6 questions to an agent dashboard; answers refresh weekly as new data is processed.
      - Pinned questions and their answers are included in the weekly email report.
  - date: '2025-10-01'
    label: new
    title: Chat Experience Enhancements
    url: https://langai.canny.io/changelog/chat-experience-enhancements
    area: conversational-agent
    breaking: false
    highlights:
      - Contextual follow-up suggestions (deep dives, breakdown queries, time comparisons).
      - Starter questions on new chats.
      - Chart visualizations generated from chat requests.
      - Chat list search moved to the top; conversations grouped by week and month.
  - date: '2025-09-15'
    label: new
    title: Email Reports
    url: https://langai.canny.io/changelog/email-reports
    area: reporting
    breaking: false
    highlights:
      - Automated weekly email reports with highlights, top 5 categories, ranking changes and growth metrics.
      - Requires a Snowflake administrator to create a notification integration first.
  - date: '2025-06-23'
    label: new
    title: Conversational AI Agents
    url: https://langai.canny.io/changelog/conversational-ai-agents
