summary: >-
  Lang.ai's object model is four entities deep. A Project is a custom classifier built
  from an uploaded dataset. The algorithm extracts Intents (each carrying Features) from
  that dataset, and users group them into Tags on the project. Documents are the text
  units analyzed or stored against a project, and a classification result is the set of
  Tags and Intents matched for a given document.
entities:
  - name: Project
    description: >-
      A custom classifier built from an uploaded dataset of customer interactions. Has a
      processing status.
    schema: openapi/langai-api-openapi.yml#/components/schemas/Project
    id_field: id
    id_format: >-
      Opaque 16-character alphanumeric string (e.g. sWP2ll1v16lLdMxM, l3wNMwIXM1S046Sy).
      No type prefix.
    fields:
      - {name: id, type: string}
      - {name: name, type: string}
      - {name: status, type: string, enum: [Errored, Processing, Completed]}
      - {name: createdAt, type: string, format: iso8601}
    operations:
      - openapi/langai-api-openapi.yml#createProject
      - openapi/langai-api-openapi.yml#listProjects
      - openapi/langai-api-openapi.yml#getProjectTags
    relationships:
      - {type: has_many, target: Tag, via: tags}
      - {type: has_many, target: Document, via: projectId}
  - name: Tag
    description: >-
      A user-defined grouping of intents and features inside a project; tags are what the
      classifier returns for a document. Tags may be drafts.
    schema: openapi/langai-api-openapi.yml#/components/schemas/Tag
    id_field: id
    id_format: >-
      Opaque 16-character alphanumeric string (e.g. tqGMbCpTBZOJaram). No type prefix.
    fields:
      - {name: id, type: string}
      - {name: name, type: string}
      - {name: createdAt, type: string, format: iso8601}
      - {name: updatedAt, type: string, format: iso8601}
      - {name: isDraft, type: boolean}
    operations:
      - openapi/langai-api-openapi.yml#getProjectTags
    relationships:
      - {type: belongs_to, target: Project, via: projectId}
    docs: https://help.lang.ai/en/articles/3175538-using-tags
  - name: Document
    description: >-
