summary: >-
  Lang.ai publishes NO pricing of its own. lang.ai 301-redirects to
  https://capacity.com/lang/, the docs host (docs.lang.ai) carries no pricing or plan
  language anywhere in the API reference, and the help center carries none either. The
  only published plan structure belongs to Capacity, the acquirer, and it is a
  three-tier contact-sales page with no prices, no currency, no billing period and no
  quantified quota. The Lang.ai REST API is not itself a purchasable line item on that
  page; the closest match is the "Pro" tier, which lists "conversation intelligence" and
  "developer platform" among its inclusions.
