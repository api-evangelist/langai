summary: >-
  Lang.ai operates NO sandbox. There is no test mode, no test-vs-live key separation, no
  key prefix distinguishing environments, no hosted console or playground, and no test
  fixtures for the REST API. The API reference documents exactly one credential — a
  single bearer token created in the Settings section of the customer's own production
  instance, where "generating a new token will invalidate the previously issued ones", so
  there is not even a second token to reserve for testing. Any experimentation against
  the Lang.ai API happens on live tenant data. What Lang.ai does publish is a synthetic
  demo dataset for the Snowflake Native App — real, first-party, and explicitly labelled
  as artificial — recorded below as fixtures.
sandbox_environment: false
test_mode: false
key_prefixes: []
key_prefix_note: >-
  No prefix is documented on the API token, and no live/test discriminator exists. The
  only token property Lang.ai publishes is that issuing a new one revokes all previous
  ones — single-active-token rotation, which makes a hard cutover the only rotation path
  and leaves no way to hold a separate testing credential.
console: null
playground: null
test_clocks: false
simulation_values: []
