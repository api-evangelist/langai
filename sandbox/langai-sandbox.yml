    note: >-
      A published sample dataset and setup script for the Snowflake Native App, not a
      sandbox: it runs inside the customer's own Snowflake account against real compute
      and requires ACCOUNTADMIN privileges plus a provisioned warehouse and compute pool.
  - name: Native App install script
    scope: snowflake-native-app
    url: https://github.com/lang-ai/snowflake-app-samples/blob/main/install-script.sql
    official: true
    note: >-
      Grants and configuration SQL for a first install. Placeholder values only
      (<YOUR_WAREHOUSE>, LANGAI_APP) — no credentials.
documentation_placeholders:
  note: >-
    The docs' example values, recorded so an agent does not mistake them for working test
    data. None of these resolve to anything.
  values:
    - value: company.lang.ai
      meaning: Placeholder tenant subdomain. Not a live host — the TLS probe on this name returns a hostname-mismatch certificate error.
    - value: YOUR_TOKEN / API_TOKEN
      meaning: Placeholder bearer token in the curl and multipart examples.
    - value: project_id / YOUR_PROJECT_ID
      meaning: Placeholder project identifier.
    - value: sWP2ll1v16lLdMxM, l3wNMwIXM1S046Sy
      meaning: Example project ids in the listProjects/getProjectTags response samples.
    - value: tqGMbCpTBZOJaram
      meaning: Example tag id in the classification response samples.
pointer_note: >-
  No `Sandbox` pointer is wired in apis.yml. The console_or_sandbox check asks whether a
  developer can exercise the API without touching production, and the answer here is no.
  Recording the absence is the finding; asserting a sandbox on the strength of a demo CSV
  would be false.
